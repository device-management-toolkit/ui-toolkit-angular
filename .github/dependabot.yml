version: 2
updates:
  # Maintain dependencies for npm modules
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      angular-stack:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'rxjs'
          - 'typescript'
        update-types:
          - patch
          - minor
      # vitest and its plugins peer-depend on the same 4.x line; bump together.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'playwright'
    ignore:
      - dependency-name: '@angular/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@angular-devkit/*'
        update-types:
          - version-update:semver-major
      - dependency-name: 'rxjs'
        update-types:
          - version-update:semver-major
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # codeql-action's sub-actions release in lockstep; one PR instead of four.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'

  - package-ecosystem: npm
    directory: /projects/kvm
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /projects/sol
    schedule:
      interval: daily
